<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SpendWise</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/extras.css?v=12">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">

    <div class="login-container premium-card">
        <div class="login-left" style="padding: 3rem;">
            <div class="brand">
                <div class="brand-icon"></div>
                <span>SpendWise</span>
            </div>
            
            <div class="login-form-container">
                <h2>Set New Password</h2>
                <p class="text-muted text-sm mb-2" id="resetDesc">Please enter a new password for your account.</p>

                <div id="formMessage" class="form-message" style="display: none; margin-bottom: 1rem; padding: 10px; border-radius: 8px;"></div>

                <form id="resetForm">
                    <input type="hidden" id="resetEmail" name="email">

                    <div class="lf-group">
                        <label for="newPassword">New Password</label>
                        <div class="lf-input-wrap">
                            <i class="fa-solid fa-lock lf-icon-left"></i>
                            <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required minlength="6">
                            <i class="fa-regular fa-eye lf-icon-right toggle-pwd"></i>
                        </div>
                    </div>

                    <div class="lf-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="lf-input-wrap">
                            <i class="fa-solid fa-lock lf-icon-left"></i>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required minlength="6">
                            <i class="fa-regular fa-eye lf-icon-right toggle-pwd"></i>
                        </div>
                    </div>

                    <button type="submit" class="lf-btn lf-btn-primary">Update Password</button>

                    <div class="lf-register mt-2">
                        <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Extract email from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        
        if (email) {
            document.getElementById('resetEmail').value = decodeURIComponent(email);
            document.getElementById('resetDesc').textContent = `Setting new password for ${decodeURIComponent(email)}`;
        } else {
            showMsg('Invalid or missing reset token. Please request a new link.', true);
            document.getElementById('resetForm').style.display = 'none';
        }

        // Toggle password visibility
        document.querySelectorAll('.toggle-pwd').forEach(icon => {
            icon.addEventListener('click', function() {
                const input = this.previousElementSibling;
                input.setAttribute('type', input.type === 'password' ? 'text' : 'password');
                this.classList.toggle('fa-eye-slash');
            });
        });

        function showMsg(msg, isError) {
            const el = document.getElementById('formMessage');
            el.textContent = msg;
            el.style.display = 'block';
            el.style.background = isError ? 'rgba(220,53,69,0.15)' : 'rgba(76,175,80,0.15)';
            el.style.color = isError ? '#ff6b6b' : '#4CAF50';
            el.style.border = '1px solid ' + (isError ? '#dc3545' : '#28a745');
        }

        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const pwd1 = document.getElementById('newPassword').value;
            const pwd2 = document.getElementById('confirmPassword').value;
            const emailInput = document.getElementById('resetEmail').value;

            if (pwd1 !== pwd2) {
                showMsg('Passwords do not match.', true);
                return;
            }

            const btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Updating...';

            fetch('api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: emailInput, newPassword: pwd1 })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    showMsg('Password updated successfully! Redirecting...', false);
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else {
                    showMsg(data.error || 'Failed to update password.', true);
                    btn.disabled = false;
                    btn.textContent = 'Update Password';
                }
            })
            .catch(() => {
                showMsg('Network error. Please try again.', true);
                btn.disabled = false;
                btn.textContent = 'Update Password';
            });
        });
    </script>
</body>
</html>
